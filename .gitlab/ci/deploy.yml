deploy:docker-push:
  extends: .gradle
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - job: build:compile
    - job: test:unit
      artifacts: false
    - job: test:integration
      artifacts: false
  services:
    - name: ${REGISTRY_DIND_IMAGE}
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_CONFIG: "./gradle"
    CACHE_POLICY: "pull"
  script:
    - |
      IMAGE_TAG="$(date +%Y%m%d-%H%M)"
      IMAGE_TAGS="latest,${IMAGE_TAG},sha-${CI_COMMIT_SHA}"
      echo "IMAGE_TAG=${IMAGE_TAG}" > .env
    - echo $DOCKER_AUTH_CONFIG_DEV > ./gradle/config.json
    - |
      ./gradlew shadowJar dockerize dockerPush \
        --build-cache \
        -PregistryHost="${REGISTRY_HOST}" \
        -PregistryNs="${REGISTRY_NS_DSE}" \
        -PimageTags="${IMAGE_TAGS}" \
        -Pdocker.image.tags="${IMAGE_TAGS}" \
        -Pdocker.registry="${REGISTRY_HOST}/${REGISTRY_NS_DSE}"
  artifacts:
    reports:
      dotenv: .env

deploy:retag-image:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  needs: []
  image: ${DOCKER_IMAGE}
  services:
    - name: ${REGISTRY_DIND_IMAGE}
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_CONFIG: "./gradle"
    CACHE_POLICY: "pull"
  script:
    - echo "IMAGE_TAG=${CI_COMMIT_TAG}" > .env
    - echo $DOCKER_AUTH_CONFIG_DEV > ./gradle/config.json
    - |
      MODULES=$(./gradlew -q printDockerImageName | sed -n 's/^DOCKER_IMAGE_MODULE://p')
      for module in $MODULES; do
        SRC="${REGISTRY_HOST}/${REGISTRY_NS_DSE}/${module}:sha-${CI_COMMIT_SHA}"
        DEST="${REGISTRY_HOST}/${REGISTRY_NS_DSE}/${module}:${CI_COMMIT_TAG}"
        docker pull "${SRC}"
        docker tag "${SRC}" "${DEST}"
        docker push "${DEST}"
      done
  artifacts:
    reports:
      dotenv: .env

deploy:dev:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - job: deploy:docker-push
      artifacts: true
  image: ${DOCKER_IMAGE}
  variables:
    KUBECONFIG: ${KUBECONFIG_DEV}
  environment:
    name: dev
  script:
    - ./deploy.sh dev merge_request

deploy:uat:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  needs:
    - job: deploy:retag-image
      artifacts: true
  image: ${DOCKER_IMAGE}
  variables:
    KUBECONFIG: ${KUBECONFIG_DEV}
  environment:
    name: uat
  script:
    - ./deploy.sh uat merge_request
