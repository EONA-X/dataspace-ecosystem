spec:
  inputs:
    deploy_environment:
      default: dev
      options:
        - dev
        - uat
        - prd
      description: "deploy:manual - target environment"
    deploy_mode:
      default: merge_request
      options:
        - push
        - merge_request
      description: "deploy:manual - push (direct) or merge_request (merge_request only if deploy_environment=prd)"
    deploy_tag:
      default: latest
      description: "deploy:manual - image tag to deploy"
    deploy_include:
      default: ""
      description: "deploy:manual - comma-separated list of modules to include (empty = all)"
---
deploy:docker-push:
  extends: .gradle
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - job: build:compile
    - job: test:unit
      artifacts: false
    - job: test:integration
      artifacts: false
  services:
    - name: ${REGISTRY_DIND_IMAGE}
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_CONFIG: "./gradle"
    CACHE_POLICY: "pull"
  script:
    - |
      IMAGE_TAG="$(date +%Y%m%d-%H%M)"
      IMAGE_TAGS="latest,${IMAGE_TAG},sha-${CI_COMMIT_SHA}"
      echo "IMAGE_TAG=${IMAGE_TAG}" > .env
    - echo $DOCKER_AUTH_CONFIG_DEV > ./gradle/config.json
    - |
      ./gradlew shadowJar dockerize dockerPush \
        --build-cache \
        -PregistryHost="${REGISTRY_HOST}" \
        -PregistryNs="${REGISTRY_NS_DSE}" \
        -PimageTags="${IMAGE_TAGS}" \
        -Pdocker.image.tags="${IMAGE_TAGS}" \
        -Pdocker.registry="${REGISTRY_HOST}/${REGISTRY_NS_DSE}"
  artifacts:
    reports:
      dotenv: .env

deploy:retag-image:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  needs: []
  image: ${DOCKER_IMAGE}
  services:
    - name: ${REGISTRY_DIND_IMAGE}
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - echo "IMAGE_TAG=${CI_COMMIT_TAG}" > .env
    - echo $DOCKER_AUTH_CONFIG_DEV > ./gradle/config.json
    - |
      MODULES="
        control-plane-postgresql-hashicorpvault
        data-plane-postgresql-hashicorpvault
        federated-catalog-postgresql-hashicorpvault
        federated-catalog-filter-postgresql-hashicorpvault
        identity-hub-postgresql-hashicorpvault
        issuer-service-postgresql-hashicorpvault
        kafka-proxy-k8s-manager
        kafka-proxy-oidc-auth
        telemetry-agent-postgresql-hashicorpvault
        telemetry-csv-manager-postgresql-hashicorpvault
        telemetry-service-postgresql-hashicorpvault
        telemetry-storage-postgresql-hashicorpvault
      "
      for module in $MODULES; do
        SRC="${REGISTRY_HOST}/${REGISTRY_NS_DSE}/${module}:sha-${CI_COMMIT_SHA}"
        DEST="${REGISTRY_HOST}/${REGISTRY_NS_DSE}/${module}:${CI_COMMIT_TAG}"
        docker pull "${SRC}"
        docker tag "${SRC}" "${DEST}"
        docker push "${DEST}"
      done
  artifacts:
    reports:
      dotenv: .env

deploy:dev:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - job: deploy:docker-push
      artifacts: true
  image: ${DOCKER_IMAGE}
  variables:
    KUBECONFIG: ${KUBECONFIG_DEV}
  environment:
    name: dev
  script:
    - ./scripts/deploy.sh --environment dev --mode push

deploy:uat:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  needs:
    - job: deploy:retag-image
      artifacts: true
  image: ${DOCKER_IMAGE}
  variables:
    KUBECONFIG: ${KUBECONFIG_DEV}
  environment:
    name: uat
  script:
    - ./scripts/deploy.sh --environment uat --mode merge_request

deploy:manual:
  stage: deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  needs: []
  image: ${DOCKER_IMAGE}
  variables:
    KUBECONFIG: ${KUBECONFIG_DEV}
    DEPLOY_ENVIRONMENT: $[[ inputs.deploy_environment ]]
    DEPLOY_MODE: $[[ inputs.deploy_mode ]]
    DEPLOY_TAG: $[[ inputs.deploy_tag ]]
    DEPLOY_INCLUDE: $[[ inputs.deploy_include ]]
  environment:
    name: $DEPLOY_ENVIRONMENT
  script:
    - |
      if [ "${DEPLOY_ENVIRONMENT}" = "prd" ]; then
        echo "WARNING: deploy_environment=prd forces deploy_mode=merge_request (was ${DEPLOY_MODE})" >&2
        DEPLOY_MODE="merge_request"
      fi
    - ./scripts/deploy.sh --environment "${DEPLOY_ENVIRONMENT}" --mode "${DEPLOY_MODE}" --tag "${DEPLOY_TAG}" --include "${DEPLOY_INCLUDE}"
