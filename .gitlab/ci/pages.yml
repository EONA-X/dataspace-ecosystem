# Documentation site: renders the repository's Markdown with site/ and publishes it
# to GitLab Pages. See site/README.md.
pages:
  stage: deploy
  image: rust:1
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs: []
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/site/target/cargo-home
    SITE_REPO_URL: ${CI_PROJECT_URL}/-/blob/${CI_DEFAULT_BRANCH}
  cache:
    key: pages-site
    paths:
      - site/target
  script:
    - cd site
    # Every tracked Markdown file must be in the navigation or excluded.
    - cargo run --release --locked -- --check
    # SITE_BASE stays unset: pages link their assets relative to themselves, which
    # works under any Pages URL.
    - cargo run --release --locked -- --out ../public
  artifacts:
    paths:
      - public
