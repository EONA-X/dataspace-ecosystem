spec:
  inputs:
    deploy_environment:
      default: dev
      options:
        - dev
        - uat
        - prd
      description: "deploy:manual - target environment"
    deploy_mode:
      default: merge_request
      options:
        - push
        - merge_request
      description: "deploy:manual - push (direct) or merge_request (forced to merge_request if deploy_environment=prd)"
    deploy_tag:
      default: latest
      description: "deploy:manual - image tag to deploy"
    deploy_include:
      default: ""
      description: "deploy:manual - comma-separated list of modules to include (empty = all)"
---
include:
  - local: '/.gitlab/ci/templates.yml'
  - local: '/.gitlab/ci/build.yml'
  - local: '/.gitlab/ci/test.yml'
  - local: '/.gitlab/ci/deploy.yml'
    inputs:
      deploy_environment: $[[ inputs.deploy_environment ]]
      deploy_mode: $[[ inputs.deploy_mode ]]
      deploy_tag: $[[ inputs.deploy_tag ]]
      deploy_include: $[[ inputs.deploy_include ]]
  - local: '/.gitlab/ci/github-sync.yml'
  - local: '/.gitlab/ci/pages.yml'

stages:
  - build
  - test
  - deploy
  - .post

variables:
  DOCKER_IMAGE: ${REGISTRY_HOST}/${REGISTRY_NS_TOOLS}/docker:28.0.1
  REGISTRY_NS_DSE: eona-x/dse
