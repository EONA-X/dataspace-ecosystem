# Navigation of the documentation site.
#
# Every tracked Markdown file must appear here or match `exclude`; `cargo run -- --check`
# fails otherwise. An entry is a Markdown file, or a directory standing for its README.md.
# `{ path = ..., title = ... }` overrides the title taken from the page's first heading.

exclude = [
  "extensions/telemetry-agent/**",
  "extensions/common/store/sql/telemetry-store-sql/README.md",
  "extensions/data-plane/data-plane-data-consumption-metrics/README.md",
]

